<input
  #hours
  type="text"
  role="spinbutton"
  inputmode="numeric"
  autocomplete="off"
  spellcheck="false"
  placeholder="--"
  data-slot="time-input-hours"
  aria-valuemin="0"
  class="box-content w-[2ch] rounded-xs bg-transparent px-0.5 caret-transparent outline-none placeholder:text-fg-faint focus:bg-surface-selected disabled:cursor-not-allowed"
  [id]="inputId()"
  [value]="texts().hours"
  [disabled]="disabled()"
  [readOnly]="readonly()"
  [attr.aria-label]="hoursLabel()"
  [attr.aria-valuenow]="parts().hours"
  [attr.aria-valuemax]="segmentMax.hours"
  [attr.aria-valuetext]="texts().hours || emptyLabel()"
  [attr.aria-invalid]="showInvalid() || null"
  [attr.aria-describedby]="ariaDescribedby() ?? null"
  [attr.aria-required]="required() || null"
  (keydown)="onKeydown($event, 'hours')"
  (beforeinput)="onBeforeInput($event, 'hours')"
  (focus)="onSegmentFocus('hours')"
/>
<span class="text-fg-muted" aria-hidden="true">:</span>

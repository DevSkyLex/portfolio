<button
  #trigger
  #origin="cdkOverlayOrigin"
  cdkOverlayOrigin
  type="button"
  role="combobox"
  aria-haspopup="dialog"
  [id]="triggerId()"
  [class]="triggerClasses()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? dialogId() : null"
  [attr.aria-invalid]="showInvalid() || null"
  [attr.aria-required]="required() || null"
  [attr.aria-describedby]="describedBy() || null"
  [attr.aria-readonly]="readonly() || null"
  [disabled]="disabled()"
  (click)="toggle()"
  (blur)="onTriggerBlur()"
>
  <span class="truncate">{{ display() }}</span>
  <ng-icon class="shrink-0 text-fg-muted" [svg]="icons.calendar" size="16" aria-hidden="true" />
</button>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayPush]="true"
  (attach)="onAttach()"
  (detach)="close(false)"
  (overlayKeydown)="onOverlayKeydown($event)"
  (overlayOutsideClick)="onOutsideClick($event)"
>
  <div
    class="animate-menu-in rounded-lg border border-border bg-surface-float shadow-float motion-reduce:animate-none"
    role="dialog"
    aria-modal="true"
    cdkTrapFocus
    [id]="dialogId()"
    [attr.aria-label]="dialogLabel()"
  >
    <ui-calendar
      [value]="value()"
      [min]="minDate()"
      [max]="maxDate()"
      [dateDisabled]="dateDisabled()"
      [weekStartsOn]="weekStartsOn()"
      (dateSelect)="selectDay($event)"
    />
    <div
      class="flex items-center gap-2 border-t border-border p-3"
      data-slot="date-time-picker-time"
    >
      <label class="text-sm text-fg-muted" [id]="timeLabelId()" [attr.for]="timeId()">
        {{ timeLabel() }}
      </label>
      <ui-time-input
        size="sm"
        class="w-auto"
        [inputId]="timeId()"
        [ariaLabelledby]="timeLabelId()"
        [minuteStep]="minuteStep()"
        [value]="time()"
        (valueChange)="onTimeChange($event)"
      />
      <button uiBtn type="button" size="sm" class="ms-auto" (click)="close(true)">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</ng-template>

<button
  #control
  class="group/radio inline-flex items-center gap-3 text-start text-control text-star outline-none focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-50"
  type="button"
  role="radio"
  [id]="controlId()"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-describedby]="ariaDescribedby() ?? null"
  [tabIndex]="tabbable() ? 0 : -1"
  [disabled]="isDisabled()"
  (click)="select()"
>
  <span [class]="indicatorClasses()" data-slot="radio-group-indicator">
    <span
      class="size-2.5 scale-0 rounded-full bg-star transition-transform duration-(--dur-pop) ease-orbit group-aria-checked/radio:scale-100 motion-reduce:transition-none"
    ></span>
  </span>
  <ng-content />
</button>

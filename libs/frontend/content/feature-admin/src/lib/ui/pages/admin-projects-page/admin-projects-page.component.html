<content-project-list-toolbar />

<ui-page-header>
  <h1 uiPageHeaderTitle>
    <ng-container i18n="@@admin.projects.title">Projets</ng-container>
    @let total = store.projects().length;
    <span class="text-[14px] font-normal text-fg-faint tabular-nums" data-slot="project-count">
      {{ countLabel() }}
      <span class="sr-only"
        ><ng-container i18n="@@admin.projects.count.noun">{total, plural,
          =0 {projet}
          =1 {projet}
          other {projets}
        }</ng-container></span
      ></span
    >
  </h1>
  <div uiPageHeaderActions>
    <a uiBtn size="xs" routerLink="new" i18n="@@admin.projects.action.create">Nouveau projet</a>
  </div>
</ui-page-header>

<content-project-list-dataview
  [projects]="store.projects()"
  [loading]="store.loading()"
  [writing]="store.writing() || bulkRunning()"
  [state]="tableState()"
  [(selection)]="selection"
  (stateChange)="changeState($event)"
  (bulkRequested)="bulk($event)"
  (projectOpened)="open($event)"
  (publishRequested)="publish($event)"
  (unpublishRequested)="unpublish($event)"
/>

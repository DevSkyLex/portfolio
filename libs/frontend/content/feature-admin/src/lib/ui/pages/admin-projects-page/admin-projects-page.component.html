<content-project-list-toolbar [label]="collectionLabel" />

<ui-page-header>
  <h1 uiPageHeaderTitle>
    {{ collectionLabel }}
    @let total = store.projects().length;
    <span class="text-[14px] font-normal text-fg-faint tabular-nums" data-slot="project-count">
      {{ countLabel() }}
      <span class="sr-only">
        <ng-container i18n="@@admin.articles.count.noun">{total, plural,
          =0 {article}
          =1 {article}
          other {articles}
        }</ng-container>
      </span></span
    >
  </h1>
  <div uiPageHeaderActions>
    <a uiBtn size="xs" routerLink="new">
      <ng-container i18n="@@admin.article.create.title">Nouvel article</ng-container>
    </a>
  </div>
</ui-page-header>

<div
  class="flex min-w-0 flex-1 flex-col gap-4 px-[max(2rem,calc((100%_-_96rem)/2_+_2rem))] py-6 @max-[640px]:px-4 @max-[640px]:py-4"
>
  <content-project-list-dataview
    [projects]="store.projects()"
    [loading]="store.loading()"
    [writing]="store.writing() || bulkRunning()"
    [state]="tableState()"
    [(selection)]="selection"
    (stateChange)="changeState($event)"
    (bulkRequested)="bulk($event)"
    (projectOpened)="open($event)"
    (publishRequested)="publish($event)"
    (unpublishRequested)="unpublish($event)"
  />
</div>

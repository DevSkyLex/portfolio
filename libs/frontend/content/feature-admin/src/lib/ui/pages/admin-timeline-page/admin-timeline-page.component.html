<header
  class="sticky top-0 z-10 flex h-12 shrink-0 items-center gap-3 border-b border-border bg-surface px-6 text-[13px] @max-[640px]:px-4"
>
  <ui-sidebar-trigger class="-ml-2" />
  <span class="font-medium text-fg" aria-current="page">{{ texts().section }}</span>
</header>

<ui-page-header>
  <h1 uiPageHeaderTitle>
    {{ texts().section }}
    @let total = store.entries().length;
    <span class="text-[14px] font-normal text-fg-faint tabular-nums" data-slot="timeline-count">
      {{ total }}<span class="sr-only"> {{ countNoun() }}</span></span
    >
  </h1>
  <div uiPageHeaderActions>
    <a #createLink uiBtn size="xs" routerLink="new">{{ texts().create }}</a>
  </div>
</ui-page-header>

@if (loadFailed()) {
  <div uiAlert variant="danger" class="mx-6 my-6 w-auto max-w-[920px] @max-[640px]:mx-4">
    <ng-icon [svg]="icons.error" size="16" aria-hidden="true" />
    <p uiAlertTitle class="text-[13px]/5">{{ texts().loadFailed }}</p>
    <div uiAlertDescription class="gap-2 text-[13px]/5">
      <p>{{ store.loadCallState().error?.message }}</p>
      <button
        uiBtn
        variant="secondary"
        size="xs"
        type="button"
        i18n="@@admin.timeline.action.retry"
        (click)="reload()"
      >
        Réessayer
      </button>
    </div>
  </div>
} @else {
  <content-timeline-list-dataview
    [kind]="kind()"
    [entries]="store.entries()"
    [texts]="texts()"
    [loading]="store.loading()"
    [writing]="store.writing() || bulkRunning()"
    [returnFocus]="createLink"
    [(selection)]="selection"
    (deleteManyRequested)="removeMany($event)"
    (entryOpened)="open($event)"
    (deleteRequested)="remove($event)"
  />
}

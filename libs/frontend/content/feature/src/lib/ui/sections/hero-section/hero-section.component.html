<section
  #hero
  class="group/hero relative flex min-h-[max(640px,calc(100dvh-70px))] flex-col justify-center pt-[96px] pb-[168px] supports-[animation-timeline:view()]:motion-safe:[view-timeline:--hero_block] @max-[768px]:min-h-[max(560px,calc(100dvh-60px))] @max-[768px]:justify-start @max-[768px]:pt-14 @max-[768px]:pb-[120px]"
  id="top"
>
  <!-- The planet is pinned behind the page; this box clips it to the hero and the header above. -->
  <div class="pointer-events-none absolute inset-x-0 -top-[100vh] bottom-0 [clip-path:inset(0)]">
    <content-ascii-planet forms="squares" [scale]="0.65" [lift]="0.16" fixed />
  </div>
  <div
    class="relative z-1 wrap group-data-scroll/hero:[transform:translateY(calc(var(--hp,0)*-120px))] group-data-scroll/hero:opacity-[calc(1-var(--hp,0)*1.3)] supports-[animation-timeline:view()]:motion-safe:animate-hero-out supports-[animation-timeline:view()]:motion-safe:[animation-range:exit_0%_exit_90%] supports-[animation-timeline:view()]:motion-safe:[animation-timeline:--hero]"
  >
    <div class="flex flex-col items-start gap-8 @max-[768px]:gap-6">
      <p
        class="-mb-2 font-display text-[clamp(18px,2cqi,26px)] leading-tight font-medium tracking-[-0.01em] text-fg"
        i18n="@@hero.greeting"
      >
        Hello, moi c’est <span class="text-accent">Valentin</span>.
      </p>
      <h1
        class="font-display text-[clamp(40px,8cqi,120px)] leading-none font-semibold tracking-[-0.04em]"
      >
        <span class="sr-only">{{ title }}</span>
        <span class="flex flex-wrap gap-x-[0.28em] gap-y-[0.06em]" aria-hidden="true">
          @for (word of words; track $index) {
            <span class="flex">
              @for (letter of word; track letter.k) {
                <span class="inline-block h-[1em] overflow-hidden">
                  <span
                    class="flex animate-slot-up flex-col [animation-delay:calc(200ms+var(--k)*40ms)] motion-reduce:[transform:translateY(-50%)] motion-reduce:animate-none"
                    [style.--k]="letter.k"
                  >
                    <span class="flex h-[1em] items-center justify-center">
                      <ui-glyph [class]="letter.color" [shape]="letter.shape" />
                    </span>
                    <span class="flex h-[1em] items-center justify-center">{{ letter.char }}</span>
                  </span>
                </span>
              }
            </span>
          }
        </span>
      </h1>
      <p
        class="-mt-2 max-w-[600px] text-lead text-fg-muted @max-[768px]:text-lead-sm"
        i18n="@@hero.subtitle"
      >
        Je crée des applications web et mobiles, de l’interface jusqu’à l’API et la base de données.
      </p>
      <div
        class="flex flex-wrap gap-3 @max-[560px]:w-full @max-[560px]:flex-col @max-[560px]:items-stretch"
      >
        <a
          uiBtn
          size="lg"
          class="@max-[560px]:w-full"
          routerLink="/articles"
          [queryParams]="{ category: 'projects' }"
          i18n="@@hero.projects"
          >Voir les projets</a
        >
        <a
          uiBtn
          variant="secondary"
          size="lg"
          class="@max-[560px]:w-full"
          href="#contact"
          i18n="@@hero.contact"
          >Me contacter</a
        >
      </div>
    </div>
  </div>
</section>

<form class="flex flex-col gap-5" novalidate (submit)="submit($event)">
  @let passwordError = error();
  <ui-field
    size="sm"
    label="Mot de passe"
    i18n-label="@@admin.identity.password.label"
    controlId="two-factor-setup-password"
    hint="Confirmez votre mot de passe pour générer une nouvelle clé."
    i18n-hint="@@admin.security.setup.passwordHint"
    [required]="true"
    [error]="passwordError"
  >
    <input
      uiInput
      size="sm"
      class="text-[13px]"
      id="two-factor-setup-password"
      type="password"
      autocomplete="current-password"
      aria-required="true"
      [attr.aria-describedby]="
        passwordError ? 'two-factor-setup-password-error' : 'two-factor-setup-password-hint'
      "
      [formField]="passwordForm.password"
    />
  </ui-field>
  <div uiDialogFooter variant="bar">
    <ui-kbd-hint [keys]="escapeKeys" label="Annuler" i18n-label="@@admin.security.cancelHint" />
    <div class="ml-auto flex flex-wrap items-center gap-2">
      <button
        uiBtn
        variant="ghost"
        size="sm"
        class="h-8 rounded-sm px-3 text-[13px]"
        type="button"
        (click)="cancelled.emit()"
        i18n="@@admin.security.cancel"
      >
        Annuler
      </button>
      <button
        uiBtn
        size="sm"
        class="h-8 rounded-sm px-3 text-[13px]"
        type="submit"
        [disabled]="pending()"
      >
        @if (pending()) {
          <ng-container i18n="@@admin.security.setup.submitting">Vérification…</ng-container>
        } @else {
          <ng-container i18n="@@admin.security.setup.submit">Continuer</ng-container>
        }
      </button>
    </div>
  </div>
</form>

<form class="flex flex-col gap-5" novalidate (submit)="submit($event)">
  @let passwordError = passwordMessage();
  <ui-field
    size="sm"
    label="Mot de passe"
    i18n-label="@@admin.identity.password.label"
    controlId="two-factor-disable-password"
    [required]="true"
    [error]="passwordError"
  >
    <input
      uiInput
      size="sm"
      class="text-[13px]"
      id="two-factor-disable-password"
      type="password"
      autocomplete="current-password"
      aria-required="true"
      [attr.aria-describedby]="passwordError ? 'two-factor-disable-password-error' : null"
      [formField]="disableForm.password"
    />
  </ui-field>
  @let codeError = codeMessage();
  <ui-field
    size="sm"
    label="Code à six chiffres"
    i18n-label="@@admin.identity.code.label"
    controlId="two-factor-disable-totp"
    [required]="true"
    [error]="codeError"
  >
    <ui-input-otp
      controlId="two-factor-disable-totp"
      ariaLabel="Code à six chiffres"
      i18n-ariaLabel="@@admin.identity.code.label"
      [ariaDescribedby]="codeError ? 'two-factor-disable-totp-error' : undefined"
      [formField]="disableForm.totp"
    >
      <div uiInputOtpGroup>
        <ui-input-otp-slot [index]="0" />
        <ui-input-otp-slot [index]="1" />
        <ui-input-otp-slot [index]="2" />
      </div>
      <ui-input-otp-separator />
      <div uiInputOtpGroup>
        <ui-input-otp-slot [index]="3" />
        <ui-input-otp-slot [index]="4" />
        <ui-input-otp-slot [index]="5" />
      </div>
    </ui-input-otp>
  </ui-field>
  <div uiDialogFooter variant="bar">
    <ui-kbd-hint [keys]="escapeKeys" label="Annuler" i18n-label="@@admin.security.cancelHint" />
    <div class="ml-auto flex flex-wrap items-center gap-2">
      <button
        uiBtn
        variant="ghost"
        size="sm"
        class="h-8 rounded-sm px-3 text-[13px]"
        type="button"
        (click)="cancelled.emit()"
        i18n="@@admin.security.cancel"
      >
        Annuler
      </button>
      <button
        uiBtn
        variant="danger"
        size="sm"
        class="h-8 rounded-sm px-3 text-[13px]"
        type="submit"
        [disabled]="pending()"
      >
        @if (pending()) {
          <ng-container i18n="@@admin.security.disable.submitting">Désactivation…</ng-container>
        } @else {
          <ng-container i18n="@@admin.security.disable.submit">Désactiver</ng-container>
        }
      </button>
    </div>
  </div>
</form>

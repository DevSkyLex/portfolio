<form class="flex flex-col gap-4" novalidate (submit)="submit($event)">
  @if (message(); as text) {
    <div uiAlert variant="danger">
      <ng-icon [svg]="icons.alert" size="16" aria-hidden="true" />
      <p uiAlertTitle>{{ text }}</p>
    </div>
  }
  <ui-field label="Adresse e-mail" controlId="login-email" [required]="true" [error]="emailError()">
    <input
      uiInput
      size="sm"
      class="h-10 text-[14px]"
      id="login-email"
      type="email"
      autocomplete="username"
      [attr.aria-describedby]="emailError() ? 'login-email-error' : null"
      placeholder="nom@domaine.fr"
      [formField]="credentialsForm.email"
    />
  </ui-field>
  <ui-field label="Mot de passe" controlId="login-password" [required]="true">
    <div class="relative">
      <input
        uiInput
        size="sm"
        class="h-10 pr-10 text-[14px]"
        id="login-password"
        autocomplete="current-password"
        placeholder="Votre mot de passe"
        [type]="revealed() ? 'text' : 'password'"
        [formField]="credentialsForm.password"
      />
      <button
        class="absolute top-1/2 right-1 grid size-8 -translate-y-1/2 cursor-pointer place-items-center rounded-option text-star-faint outline-2 outline-offset-0 outline-transparent transition-colors duration-(--dur-pop) ease-orbit hover:bg-star/5 hover:text-star focus-visible:text-star focus-visible:outline-signal/55"
        type="button"
        [attr.aria-label]="revealed() ? 'Masquer la saisie' : 'Afficher la saisie'"
        [attr.aria-pressed]="revealed()"
        (click)="revealed.set(!revealed())"
      >
        <ng-icon [svg]="revealed() ? icons.hide : icons.show" size="16" aria-hidden="true" />
      </button>
    </div>
  </ui-field>
  <div class="flex items-start gap-2.5 px-0.5 py-1 text-[13px]/5">
    <ui-checkbox
      class="mt-0.5"
      size="sm"
      controlId="login-remember"
      [formField]="credentialsForm.remember"
    />
    <label class="cursor-pointer text-star" for="login-remember">Se souvenir de moi</label>
  </div>
  <button uiBtn class="mt-1 h-10 w-full text-[14px]" type="submit" [disabled]="pending()">
    {{ pending() ? 'Connexion…' : 'Se connecter' }}
  </button>
</form>

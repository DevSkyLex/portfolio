<form class="flex flex-col gap-4" novalidate (submit)="submit($event)">
  <!-- Only the server's answer: each field states its own error under it. -->
  @if (failure(); as text) {
    <div uiAlert variant="danger">
      <ng-icon [svg]="icons.alert" size="16" aria-hidden="true" />
      <p uiAlertTitle>{{ text }}</p>
    </div>
  }
  <ui-field
    label="Adresse e-mail"
    i18n-label="@@admin.login.email.label"
    size="sm"
    controlId="login-email"
    [required]="true"
    [error]="emailError()"
  >
    <input
      uiInput
      size="sm"
      class="h-10 text-[14px]"
      id="login-email"
      type="email"
      autocomplete="username"
      [attr.aria-describedby]="emailError() ? 'login-email-error' : null"
      placeholder="nom@domaine.fr"
      i18n-placeholder="@@admin.login.email.placeholder"
      [formField]="credentialsForm.email"
    />
  </ui-field>
  <ui-field
    label="Mot de passe"
    i18n-label="@@admin.identity.password.label"
    size="sm"
    controlId="login-password"
    [required]="true"
    [error]="passwordError()"
  >
    <div class="relative">
      <input
        uiInput
        size="sm"
        class="h-10 pr-10 text-[14px]"
        id="login-password"
        autocomplete="current-password"
        placeholder="Votre mot de passe"
        i18n-placeholder="@@admin.login.password.placeholder"
        [attr.aria-describedby]="passwordError() ? 'login-password-error' : null"
        [type]="revealed() ? 'text' : 'password'"
        [formField]="credentialsForm.password"
      />
      <button
        class="absolute top-1/2 right-1 grid size-8 -translate-y-1/2 cursor-pointer place-items-center rounded-xs text-fg-faint outline-2 outline-offset-0 outline-transparent transition-colors duration-(--dur-pop) ease-orbit hover:bg-surface-hover hover:text-fg focus-visible:text-fg focus-visible:outline-accent/55"
        type="button"
        [attr.aria-label]="revealLabel()"
        [attr.aria-pressed]="revealed()"
        (click)="revealed.set(!revealed())"
      >
        <ng-icon [svg]="revealed() ? icons.hide : icons.show" size="16" aria-hidden="true" />
      </button>
    </div>
  </ui-field>
  <div class="flex items-start gap-2.5 px-0.5 py-1 text-[13px]/5">
    <ui-checkbox
      class="mt-0.5"
      size="sm"
      controlId="login-remember"
      [formField]="credentialsForm.remember"
    />
    <label class="cursor-pointer text-fg" for="login-remember" i18n="@@admin.login.remember"
      >Se souvenir de moi</label
    >
  </div>
  <button uiBtn class="mt-1 h-10 w-full text-[14px]" type="submit" [disabled]="pending()">
    @if (pending()) {
      <ng-container i18n="@@admin.login.submitting">Connexion…</ng-container>
    } @else {
      <ng-container i18n="@@admin.login.submit">Se connecter</ng-container>
    }
  </button>
</form>

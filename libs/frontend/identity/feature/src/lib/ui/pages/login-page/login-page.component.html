<main class="relative flex min-h-dvh flex-col items-center justify-center px-6 py-20">
  <a
    class="absolute top-5 left-5 inline-flex h-8 items-center gap-1.5 rounded-sm px-2 text-[13px] text-fg-muted outline-2 outline-offset-0 outline-transparent transition-colors duration-(--dur-pop) ease-orbit hover:bg-surface-hover hover:text-fg focus-visible:outline-accent/55"
    routerLink="/"
  >
    <ng-icon [svg]="icons.back" size="14" aria-hidden="true" />
    <ng-container i18n="@@admin.login.backToSite">Retour au site</ng-container>
  </a>

  <div class="flex w-full max-w-[360px] flex-col gap-8">
    @if (step() === 'credentials') {
      <div class="flex flex-col gap-1.5">
        <h1
          class="text-[22px]/7 font-semibold tracking-[-0.01em] text-fg"
          i18n="@@admin.login.title"
        >
          Administration
        </h1>
        <p class="text-[14px]/5 text-fg-muted" i18n="@@admin.login.intro">
          Connexion réservée au propriétaire du site.
        </p>
      </div>

      <identity-credentials-form
        [initialValues]="credentials()"
        [pending]="pending()"
        [failure]="failure()"
        (submitted)="signIn($event)"
      />
    } @else {
      <div class="flex flex-col gap-1.5">
        <h1
          class="text-[22px]/7 font-semibold tracking-[-0.01em] text-fg"
          i18n="@@admin.login.code.title"
        >
          Code de vérification
        </h1>
        <p class="text-[14px]/5 text-fg-muted" i18n="@@admin.login.code.intro">
          Saisissez le code à six chiffres de votre application d’authentification pour
          <span class="text-fg">{{ credentials()?.email }}</span
          >.
        </p>
      </div>

      <identity-login-code-form
        [pending]="pending()"
        [failure]="failure()"
        (submitted)="verify($event)"
      />

      <button
        class="-ml-2 inline-flex h-8 cursor-pointer items-center gap-1.5 self-start rounded-sm px-2 text-[13px] text-fg-muted outline-2 outline-offset-0 outline-transparent transition-colors duration-(--dur-pop) ease-orbit hover:bg-surface-hover hover:text-fg focus-visible:outline-accent/55"
        type="button"
        (click)="back()"
      >
        <ng-icon [svg]="icons.back" size="14" aria-hidden="true" />
        <ng-container i18n="@@admin.login.changeAccount">Changer de compte</ng-container>
      </button>
    }
  </div>
</main>

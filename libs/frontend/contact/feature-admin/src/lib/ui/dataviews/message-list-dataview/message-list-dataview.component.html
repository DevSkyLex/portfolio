<ul class="min-h-0 flex-1 overflow-y-auto" role="list" [attr.aria-label]="label()">
  @for (message of messages(); track message.id) {
    @let unread = message.status === 'received';
    <li class="border-b border-border">
      <button
        class="relative grid w-full cursor-pointer grid-cols-[28px_minmax(0,1fr)_auto] gap-x-3 px-4 py-2.5 text-left outline-2 -outline-offset-2 outline-transparent transition-colors duration-(--dur-pop) ease-orbit before:absolute before:inset-y-0 before:left-0 before:w-0.5 hover:bg-surface-hover focus-visible:outline-accent/55 aria-[current=true]:bg-surface-selected aria-[current=true]:before:bg-accent"
        type="button"
        [class]="unread ? 'before:bg-border-strong' : ''"
        [id]="'message-' + message.id"
        [attr.aria-current]="selectedId() === message.id"
        (click)="opened.emit(message)"
      >
        <span
          uiAvatar
          size="sm"
          class="row-span-3 mt-0.5 size-7 font-sans text-[11px] font-semibold"
          aria-hidden="true"
        >
          <span uiAvatarFallback>{{ initials(message.name) }}</span>
        </span>
        @if (unread) {
          <span class="sr-only" i18n="@@admin.inbox.list.unread">Non lu</span>
        }
        <span
          class="col-start-2 row-start-1 truncate text-[13px]/5 text-fg"
          [class]="unread ? 'font-semibold' : 'font-medium'"
          >{{ message.name }}</span
        >
        <time
          class="col-start-3 row-start-1 text-[12px]/5 whitespace-nowrap text-fg-faint tabular-nums"
          [attr.datetime]="message.receivedAt"
          [title]="message.receivedAt | date: 'short'"
          >{{ when(message.receivedAt) }}</time
        >
        <span
          class="col-span-2 col-start-2 truncate text-[12px]/4"
          [class]="unread ? 'font-medium text-fg' : 'text-fg-muted'"
          >{{ subjects[message.subject] }}</span
        >
        <span class="col-span-2 col-start-2 truncate text-[12px]/4 text-fg-faint">{{
          message.message
        }}</span>
      </button>
    </li>
  }
</ul>
<p
  class="flex shrink-0 flex-wrap items-center gap-x-3 gap-y-1 border-t border-border px-4 py-2 text-[12px] text-fg-faint @max-[1024px]:hidden"
>
  <span class="inline-flex items-center gap-1"
    ><kbd uiKbd>J</kbd><kbd uiKbd>K</kbd
    ><ng-container i18n="@@admin.inbox.hint.navigate"> naviguer</ng-container></span
  >
  <span class="inline-flex items-center gap-1"
    ><kbd uiKbd>E</kbd
    ><ng-container i18n="@@admin.inbox.hint.archive"> archiver</ng-container></span
  >
  <span class="inline-flex items-center gap-1"
    ><kbd uiKbd>?</kbd
    ><ng-container i18n="@@admin.inbox.hint.shortcuts"> raccourcis</ng-container></span
  >
</p>
@if (pages() > 1) {
  <nav
    class="flex h-11 shrink-0 items-center justify-between gap-2 border-t border-border px-3"
    aria-label="Pages"
    i18n-aria-label="@@admin.inbox.pagination.label"
  >
    <button
      uiBtn
      size="xs"
      variant="ghost"
      type="button"
      [disabled]="page() <= 1"
      (click)="pageChange.emit(page() - 1)"
    >
      <ng-icon [svg]="icons.previous" size="14" aria-hidden="true" />
      <ng-container i18n="@@admin.inbox.pagination.previous">Précédents</ng-container>
    </button>
    <span class="text-[12px] text-fg-faint">{{ page() }} / {{ pages() }}</span>
    <button
      uiBtn
      size="xs"
      variant="ghost"
      type="button"
      [disabled]="page() >= pages()"
      (click)="pageChange.emit(page() + 1)"
    >
      <ng-container i18n="@@admin.inbox.pagination.next">Suivants</ng-container>
      <ng-icon [svg]="icons.next" size="14" aria-hidden="true" />
    </button>
  </nav>
}

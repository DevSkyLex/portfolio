<section
  class="@container/contact relative scroll-mt-24 bg-void pt-80 pb-40 shadow-[0_-1px_0_var(--void)] @max-[768px]:pt-100 @max-[768px]:pb-16"
  id="contact"
  uiSectionFx
  aria-labelledby="contact-title"
>
  <ui-deco [glyphs]="deco" />
  <div class="relative z-1 wrap" [class]="sectionFx">
    <ui-section-heading headingId="contact-title" i18n="@@section.contact"
      >Contact</ui-section-heading
    >

    <div
      class="grid items-start gap-12 @min-[960px]/contact:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)] @min-[960px]/contact:gap-16"
    >
      <div class="flex flex-col gap-6" [class]="reveal" uiReveal>
        <p class="max-w-measure text-body text-star-muted" i18n="@@contact.lead">
          Pour un poste, une mission ou une question.
        </p>
        <ul class="flex flex-col" role="list">
          <li>
            <a [class]="link" [href]="'mailto:' + links.email">
              <ng-icon
                class="mr-2.5"
                [svg]="icons.mail"
                size="16"
                strokeWidth="2.25"
                aria-hidden="true"
              />
              {{ links.email }}
            </a>
          </li>
          <li>
            <a [class]="link" [href]="links.github">
              <ng-icon class="mr-2.5" [svg]="icons.github" size="16" aria-hidden="true" />
              GitHub
            </a>
          </li>
          <li>
            <a [class]="link" [href]="links.linkedin">
              <ng-icon class="mr-2.5" [svg]="icons.linkedin" size="16" aria-hidden="true" />
              LinkedIn
            </a>
          </li>
        </ul>
      </div>

      <div class="@container relative z-1 [--rd:80ms]" [class]="reveal" uiReveal>
        @if (store.sent()) {
          <div
            class="flex flex-col items-start gap-6 py-8 outline-none"
            id="contact-sent"
            role="status"
            tabindex="-1"
          >
            <span
              class="grid size-14 place-items-center rounded-full border border-success text-success-ink transition-[opacity,scale] duration-(--dur-roll) ease-orbit motion-reduce:transition-none starting:scale-60 starting:opacity-0 [&_path]:transition-[stroke-dashoffset] [&_path]:delay-200 [&_path]:duration-(--dur-roll) [&_path]:ease-orbit [&_path]:[stroke-dasharray:24] motion-reduce:[&_path]:transition-none starting:[&_path]:[stroke-dashoffset:24]"
              aria-hidden="true"
            >
              <ng-icon [svg]="icons.check" size="24" strokeWidth="1.875" />
            </span>
            <h3
              class="animate-fade-up font-display text-d3 text-star [animation-delay:80ms] motion-reduce:animate-none"
              i18n="@@contact.sent.title"
            >
              Message envoyé
            </h3>
            <p
              class="animate-fade-up text-body text-star-muted [animation-delay:160ms] motion-reduce:animate-none"
              i18n="@@contact.sent.body"
            >
              Merci {{ firstName() }}. Je vous réponds à
              <span class="font-mono text-data text-star">{{ store.sentTo() }}</span
              >.
            </p>
            <button
              class="animate-fade-up [animation-delay:240ms] motion-reduce:animate-none"
              uiBtn
              variant="secondary"
              type="button"
              (click)="writeAnother()"
              i18n="@@contact.sent.again"
            >
              Écrire un autre message
            </button>
          </div>
        } @else {
          <contact-form
            [pending]="store.sending()"
            [failure]="store.error()?.message ?? null"
            [serverErrors]="serverErrors()"
            (submitted)="send($event)"
          />
        }
      </div>
    </div>
  </div>
</section>

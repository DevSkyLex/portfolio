# Main configuration (replaces the image's), shared by production and development:
# workers, JSON access log, timeouts, compression; sites and http-level settings in conf.d/*.conf.
user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;

  # Slow clients (slowloris) and idle connections.
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 30s;
  reset_timedout_connection on;
  client_max_body_size 64k;

  # One JSON line per request (docker logs); request_id links Nginx, the browser and the services.
  # Path without query string, no referrer: no personal data beyond the client address.
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id_out","remote_addr":"$remote_addr",'
    '"host":"$host","method":"$request_method","uri":"$uri","protocol":"$server_protocol",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;

  # Compress proxied SSR HTML and static resources on the fly.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/xml text/javascript application/javascript application/json
    application/problem+json application/xml application/manifest+json image/svg+xml image/x-icon;

  include /etc/nginx/conf.d/*.conf;
}

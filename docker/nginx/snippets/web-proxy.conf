# SSR uses the fixed private upstream; request headers cannot choose a content-service target.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id_out;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $external_scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_hide_header X-Powered-By;
proxy_hide_header X-Request-Id;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
error_page 502 503 504 = @site_unavailable;

# Security headers (production, HTTPS), set at server level. `add_header_inherit merge` (site.conf)
# keeps them in the locations that add their own headers.
# Development copy without HSTS and upgrade-insecure-requests: docker/nginx/dev/security-headers.conf
# (scripts/check-ops.sh checks that both CSPs stay identical).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
# Scripts from the site (D20), plus Angular's two inline event replay scripts, allowed by a nonce per
# request (`$request_id`, Nginx's random 128-bit id, passed to SSR in web-proxy.conf; D20 revision),
# and the Google tag the bundle loads after the visitor's consent (D48) with its collection hosts in
# img-src and connect-src.
# style-src 'unsafe-inline': Angular component styles and style attributes of server-rendered pages.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

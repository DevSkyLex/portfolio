# Security headers (production, HTTPS), set at server level. `add_header_inherit merge` (site.conf)
# keeps them in the locations that add their own headers.
# Development copy without HSTS and upgrade-insecure-requests: docker/nginx/dev/security-headers.conf
# (scripts/check-ops.sh checks that both CSPs stay identical).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
# No inline script in the site (D20): script-src 'self' is enough.
# style-src 'unsafe-inline': Angular component styles and style attributes of the prerendered pages.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

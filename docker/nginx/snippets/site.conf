# Site, admin area and APIs: shared by production (Traefik TLS) and development (HTTP); the including server
# block sets the security headers. Current site release: `current` link switched by
# scripts/publish-site.sh; `previous` keeps serving the hashed files of the release it replaced.
root /srv/site/current/browser;
index index.html;
charset utf-8;
client_max_body_size 64k;

# Locations that add headers keep the server's (security headers, request id).
add_header_inherit merge;
add_header X-Request-Id $request_id_out always;

# Maintenance: create /srv/site/maintenance to answer 503 (prerendered error page).
if (-f /srv/site/maintenance) {
  return 503;
}

# --- OAuth discovery for MCP clients (D45) -------------------------------------------------------

# RFC 8414 metadata at the path-insertion URL that clients derive from the issuer
# https://<host>/api/auth; identity-service serves it at the path-appending form. Exact locations
# win over the hidden-file regex below.
location = /.well-known/oauth-authorization-server/api/auth {
  limit_req zone=api burst=20 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://identity_service/api/auth/.well-known/oauth-authorization-server;
}

# RFC 9728 metadata of the MCP resource https://<host>/api/content/mcp, served by content-service at
# the path-appending form (`protectedResourceMetadataUrl` of libs/backend/platform/auth).
location = /.well-known/oauth-protected-resource/api/content/mcp {
  limit_req zone=api burst=20 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://content_service/api/content/mcp/.well-known/oauth-protected-resource;
}

# --- API (prefix locations with ^~: never caught by the static file regexes) ---------------------

# OAuth token and revocation endpoints (D45): clients call them at every refresh; PKCE and single-use
# hashed codes make guessing useless, the budget only bounds abuse. Small form bodies.
location = /api/auth/oauth/token {
  limit_req zone=oauth burst=10 nodelay;
  client_max_body_size 8k;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://identity_service;
}

location = /api/auth/oauth/revoke {
  limit_req zone=oauth burst=10 nodelay;
  client_max_body_size 8k;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://identity_service;
}

# Dynamic client registration (RFC 7591, unauthenticated): the login budget per address, on top of the
# service's own hourly cap for all addresses.
location = /api/auth/oauth/register {
  limit_req zone=auth burst=5 nodelay;
  client_max_body_size 8k;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://identity_service;
}

location = /api/auth/login {
  limit_req zone=auth burst=5 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://identity_service;
}

# Second login step (one-time code): same per-address budget as the password step.
location = /api/auth/login/totp {
  limit_req zone=auth burst=5 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://identity_service;
}

# Second-factor enrollment and removal (D17): they check the password and codes again, so they share the
# login budget; the longer prefix wins over /api/auth/.
location ^~ /api/auth/totp {
  limit_req zone=auth burst=5 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://identity_service;
}

location ^~ /api/auth/ {
  limit_req zone=api burst=20 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://identity_service;
}

location = /api/contact/messages {
  limit_req zone=contact burst=3 nodelay;
  client_max_body_size 16k;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://contact_service;
}

location ^~ /api/contact/admin/ {
  limit_req zone=api burst=20 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://contact_service;
}

# Admin edits of projects (rich article documents, D40): just above the service's own JSON limit (1 MB),
# which answers in problem+json; a larger body is refused here, also in problem+json.
location ^~ /api/content/admin/projects/ {
  limit_req zone=api burst=20 nodelay;
  client_max_body_size 1100k;
  error_page 413 = @payload_too_large;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://content_service;
}

# Admin edits of the legal documents (two rich documents per revision, D44): same limit as projects.
location ^~ /api/content/admin/legal/ {
  limit_req zone=api burst=20 nodelay;
  client_max_body_size 1100k;
  error_page 413 = @payload_too_large;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://content_service;
}

# Admin image upload (multipart, D40): the service caps the file at 10 MiB, 11m leaves room for the
# multipart envelope. The body is buffered here (tmpfs /var/cache/nginx) before reaching the service.
location = /api/content/admin/media {
  limit_req zone=api burst=20 nodelay;
  client_max_body_size 11m;
  error_page 413 = @media_too_large;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://content_service;
}

# Other content routes (snapshot, publication): small bodies only.
location ^~ /api/content/ {
  limit_req zone=api burst=20 nodelay;
  client_max_body_size 128k;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://content_service;
}

location @payload_too_large {
  default_type application/problem+json;
  add_header Cache-Control "no-store" always;
  return 413 '{"type":"about:blank","title":"Payload too large","status":413,"code":"http.413"}';
}

# Same code as the service's own refusal of a file above 10 MiB (MEDIA_ERROR_CODES).
location @media_too_large {
  default_type application/problem+json;
  add_header Cache-Control "no-store" always;
  return 413 '{"type":"about:blank","title":"Payload too large","status":413,"code":"content.media-too-large"}';
}

location @api_unavailable {
  default_type application/problem+json;
  add_header Cache-Control "no-store" always;
  return 503 '{"type":"about:blank","title":"Service unavailable","status":503,"code":"service.unavailable"}';
}

# Everything else under /api (including the services' /health) is not exposed.
location ^~ /api/ {
  default_type application/problem+json;
  return 404 '{"type":"about:blank","title":"Not found","status":404,"code":"http.404"}';
}

# --- Admin area (client-rendered, one per locale build: French at /admin/, English at /en/admin/) --

location = /admin {
  return 301 /admin/;
}

location ^~ /admin/ {
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  try_files /index.csr.html =404;
}

location = /en/admin {
  return 301 /en/admin/;
}

location ^~ /en/admin/ {
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  try_files /en/index.csr.html =404;
}

# --- Uploaded media (D40) --------------------------------------------------------------------------

# Images re-encoded to WebP by content-service in the media directory (read-only mount at /srv/media).
# Only the fixed names `<uuid>.webp` and `<uuid>-960.webp` are served; a name never changes content, so
# they are cached for a year. Anything else (temporary files, listings, other names) answers 404. The
# site build writes its fonts and other CSS resources to /assets/ instead (`outputPath.media` in
# apps/web/project.json), checked by tools/architecture/src/workspace.spec.ts.
location ^~ /media/ {
  root /srv;

  location ~ "^/media/[0-9a-f-]{36}(?:-960)?\.webp$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  return 404;
}

# --- Static files ----------------------------------------------------------------------------------

# Hidden files (.git, .env…) are never served. Traefik handles ACME before reaching this origin.
location ~ /\. {
  return 404;
}

# Administration stylesheet (D31), loaded by the admin area only: Angular writes non-injected bundles
# without a content hash, so this name is revalidated on every request (ETag) and never served stale
# after a publication. Each locale build has its copy, loaded against its base href (/ and /en/).
location = /admin.css {
  add_header Cache-Control "no-cache" always;
  try_files $uri =404;
}

location = /en/admin.css {
  add_header Cache-Control "no-cache" always;
  try_files $uri =404;
}

# Hashed names of the Angular build (`name-XXXXXXXX.ext`): cached for a year. A page loaded before a
# publication still finds its chunks in the previous release.
location ~ "-[A-Za-z0-9_-]{8}\.(?:js|css|woff2|png|jpe?g|webp|avif|svg|ico)$" {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri @previous_release;
}

location @previous_release {
  root /srv/site/previous/browser;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

# Other static files (favicon, unhashed images, text files): short cache.
location ~* \.(?:js|css|woff2?|png|jpe?g|webp|avif|gif|svg|ico|txt|xml|webmanifest)$ {
  add_header Cache-Control "public, max-age=3600" always;
  try_files $uri =404;
}

# Error pages: only served through error_page, with their real status.
location ^~ /error/ {
  internal;
  add_header Cache-Control "no-store" always;
}

location ^~ /en/error/ {
  internal;
  add_header Cache-Control "no-store" always;
}

# Prerendered pages: revalidated on every visit (ETag), so a publication is seen immediately.
location /en/ {
  add_header Cache-Control "no-cache" always;
  error_page 404 /en/error/404/index.html;
  try_files $uri $uri/index.html =404;
}

location / {
  add_header Cache-Control "no-cache" always;
  try_files $uri $uri/index.html =404;
}

error_page 403 /error/403/index.html;
error_page 404 /error/404/index.html;
error_page 500 502 504 /error/500/index.html;
error_page 503 /error/503/index.html;

# Forwarding to the services: request id kept (or created), client address, protocol.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id_out;
# Production restores the client address from the explicitly trusted Traefik peer first.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $external_scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_hide_header X-Powered-By;
# Sent once, by Nginx (site.conf): the services echo the same value.
proxy_hide_header X-Request-Id;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
limit_conn api_conn 20;
# Service stopped or unreachable: problem+json response rather than the site's HTML page.
error_page 502 503 504 = @api_unavailable;

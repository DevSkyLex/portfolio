# http level, shared by production and development: rate limits, request id, services, health probe.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=contact:10m rate=6r/m;
# OAuth token and revocation endpoints of the MCP authorization server (D45).
limit_req_zone $binary_remote_addr zone=oauth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Request id: the browser's if valid, otherwise a new one (carried into the services' logs).
map $http_x_request_id $request_id_out {
  "~^[A-Za-z0-9_-]{8,64}$" $http_x_request_id;
  default $request_id;
}

# Services resolved at runtime through Docker's DNS: Nginx starts without them and follows a
# recreated container (new address) without a reload.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

upstream content_service {
  zone content_service 64k;
  server content-service:3101 resolve;
  keepalive 8;
}

upstream contact_service {
  zone contact_service 64k;
  server contact-service:3102 resolve;
  keepalive 8;
}

upstream identity_service {
  zone identity_service 64k;
  server identity-service:3103 resolve;
  keepalive 8;
}

upstream web_service {
  zone web_service 64k;
  server web:4000 resolve;
  keepalive 8;
}

# Container health probe (compose healthcheck), local to the container only.
server {
  listen 127.0.0.1:8081;
  access_log off;

  location = /health {
    return 204;
  }

  location / {
    return 404;
  }
}

# Production on the VPS (/srv/apps/portfolio/production). Images published by the `deploy` workflow.
# Variables: .env (written by Ansible); see .env.example. TAG is saved after successful deployment.
# Secrets: files in ./secrets (see docs/operations/deployment.md), never in variables.
# Only Nginx joins the existing shared Traefik network. Services and Postgres stay private.
name: ${COMPOSE_PROJECT_NAME:-portfolio}

x-logging: &logging
  driver: local
  options: { max-size: '${LOG_MAX_SIZE:-10m}', max-file: '${LOG_MAX_FILES:-5}' }

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging: *logging

x-service: &service
  <<: *hardening
  restart: unless-stopped
  init: true
  tmpfs: ['/tmp:size=16m']
  stop_grace_period: 20s
  networks: [proxy, database]
  depends_on:
    postgres:
      condition: service_healthy
  deploy:
    resources:
      limits: { cpus: '1.0', memory: 384M, pids: 128 }

# One-off operations (ops profile): database network only, never restarted.
x-job: &job
  <<: *service
  profiles: [ops]
  restart: 'no'
  networks: [database]

x-auth: &auth
  AUTH_ISSUER: https://${APP_HOST:?APP_HOST is not set (.env)}/api/auth
  AUTH_JWKS_URL: http://identity-service:3103/api/auth/jwks.json

x-identity: &identity
  IDENTITY_KEYS_DIR: /run/identity-keys
  IDENTITY_SIGNING_KID: ${IDENTITY_SIGNING_KID:?IDENTITY_SIGNING_KID is not set (.env)}
  IDENTITY_ISSUER: https://${APP_HOST:?APP_HOST is not set (.env)}/api/auth

x-contact: &contact
  CONTACT_MAIL_FROM: ${CONTACT_MAIL_FROM:?CONTACT_MAIL_FROM is not set (.env)}
  CONTACT_NOTIFY_TO: ${CONTACT_NOTIFY_TO:?CONTACT_NOTIFY_TO is not set (.env)}

services:
  postgres:
    <<: *hardening
    image: postgres:17.11-alpine3.23@sha256:05aa77262db9277fde6374bb2f901c9604b8a9373029e1a7993440c6aae48736
    restart: unless-stopped
    # The entrypoint prepares the data directory as root, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: ['/tmp:size=64m', '/var/run/postgresql:size=1m']
    shm_size: 128m
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums
    # Tuned for a small VPS (2–4 GB of RAM, SSD) and three services with 5 pooled connections each.
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
      - -c
      - idle_in_transaction_session_timeout=5min
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_lock_waits=on
    secrets:
      - postgres_password
      - content_migrator_password
      - content_app_password
      - contact_migrator_password
      - contact_app_password
      - identity_migrator_password
      - identity_app_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d portfolio']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [database]
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 768M, pids: 200 }

  identity-service:
    <<: *service
    image: ${REGISTRY:?REGISTRY is not set (.env)}/portfolio-identity-service:${TAG:?TAG is not set (.env, scripts/deploy.sh)}
    environment:
      <<: *identity
      IDENTITY_PORT: '3103'
      SERVICE_PORT: '3103'
      IDENTITY_DATABASE_URL_FILE: /run/secrets/identity_database_url
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [identity_database_url]
    volumes:
      - ./secrets/identity-keys:/run/identity-keys:ro

  content-service:
    <<: *service
    image: ${REGISTRY:?REGISTRY is not set (.env)}/portfolio-content-service:${TAG:?TAG is not set (.env, scripts/deploy.sh)}
    environment:
      <<: *auth
      CONTENT_PORT: '3101'
      SERVICE_PORT: '3101'
      CONTENT_DATABASE_URL_FILE: /run/secrets/content_database_url
      SITE_BUILD_REPOSITORY: ${SITE_BUILD_REPOSITORY:-}
      SITE_BUILD_TOKEN_FILE: /run/secrets/site_build_token
      # Uploaded images (D40): written here by the service, served by Nginx from the same directory.
      CONTENT_MEDIA_DIR: /srv/media
      # SEO dashboard (D47): each Google source is optional; an empty setting or secret file leaves
      # its section "not-configured". The credentials file is read by the service on first use only.
      SEO_SITE_ORIGIN: https://${APP_HOST:?APP_HOST is not set (.env)}
      SEO_GOOGLE_CREDENTIALS_PATH: /run/secrets/seo_google_credentials
      SEO_SEARCH_CONSOLE_PROPERTY: ${SEO_SEARCH_CONSOLE_PROPERTY:-}
      SEO_GA4_PROPERTY_ID: ${SEO_GA4_PROPERTY_ID:-}
      SEO_PAGESPEED_API_KEY_FILE: /run/secrets/seo_pagespeed_api_key
      SEO_WEB_VITALS_URLS: ${SEO_WEB_VITALS_URLS:-}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [content_database_url, site_build_token, seo_google_credentials, seo_pagespeed_api_key]
    # The only writable path of its read-only file system: the host media directory (owner UID 1000).
    volumes:
      - ${MEDIA_ROOT:-/srv/apps/portfolio/production/media}:/srv/media
    deploy:
      resources:
        # Above the other services: sharp decodes an uploaded image (up to 50 megapixels) in memory.
        limits: { cpus: '1.0', memory: 512M, pids: 128 }

  contact-service:
    <<: *service
    image: ${REGISTRY:?REGISTRY is not set (.env)}/portfolio-contact-service:${TAG:?TAG is not set (.env, scripts/deploy.sh)}
    environment:
      <<: [*auth, *contact]
      CONTACT_PORT: '3102'
      SERVICE_PORT: '3102'
      CONTACT_DATABASE_URL_FILE: /run/secrets/contact_database_url
      CONTACT_SMTP_URL_FILE: /run/secrets/contact_smtp_url
      CONTACT_CLIENT_KEY_SECRET_FILE: /run/secrets/contact_client_key_secret
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [contact_database_url, contact_smtp_url, contact_client_key_secret]

  nginx:
    <<: *hardening
    container_name: ${CONTAINER_NAME:-portfolio}
    image: nginx:1.29.8-alpine3.23@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    # Private HTTP origin; Traefik owns public ports, redirects and certificates.
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    tmpfs: ['/var/cache/nginx:size=32m', '/run:size=1m', '/tmp:size=16m']
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST is not set (.env)}
      APP_PORT: ${APP_PORT:-80}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?Set TRUSTED_PROXIES to the reviewed Traefik IP or CIDR (.env)}
      NGINX_ENVSUBST_FILTER: '^(APP_HOST|APP_PORT|TRUSTED_PROXIES)$$'
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${SITE_ROOT:-/srv/apps/portfolio/production/site}:/srv/site:ro
      - ${MEDIA_ROOT:-/srv/apps/portfolio/production/media}:/srv/media:ro
    # Upstreams are resolved at runtime (`resolve`): no start order needed, recreated services are followed.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/health']
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [proxy, traefik_proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-portfolio}.rule=Host(`${APP_HOST}`) || Host(`www.${APP_HOST}`)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-portfolio}.entrypoints=web
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-portfolio}.middlewares=${TRAEFIK_ROUTER_NAME:-portfolio}-https
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-portfolio}.service=${TRAEFIK_ROUTER_NAME:-portfolio}
      - traefik.http.middlewares.${TRAEFIK_ROUTER_NAME:-portfolio}-https.redirectscheme.scheme=https
      - traefik.http.middlewares.${TRAEFIK_ROUTER_NAME:-portfolio}-https.redirectscheme.permanent=true
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-portfolio}-secure.rule=Host(`${APP_HOST}`) || Host(`www.${APP_HOST}`)
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-portfolio}-secure.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-portfolio}-secure.tls=true
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-portfolio}-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-portfolio}-secure.middlewares=${TRAEFIK_SECURE_MIDDLEWARES:-}
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-portfolio}-secure.service=${TRAEFIK_ROUTER_NAME:-portfolio}
      - traefik.http.services.${TRAEFIK_ROUTER_NAME:-portfolio}.loadbalancer.server.port=${APP_PORT:-80}
      - traefik.http.services.${TRAEFIK_ROUTER_NAME:-portfolio}.loadbalancer.server.scheme=http
    deploy:
      resources:
        limits: { cpus: '${WEB_CPU_LIMIT:-1.0}', memory: '${WEB_MEMORY_LIMIT:-128M}', pids: 64 }

  # --- One-off operations: docker compose --profile ops run --rm <name> ---
  content-migrate:
    <<: *job
    image: ${REGISTRY:?REGISTRY is not set (.env)}/portfolio-content-service:${TAG:?TAG is not set (.env, scripts/deploy.sh)}
    command: ['node', 'cli.js', 'migrate']
    environment:
      <<: *auth
      CONTENT_DATABASE_URL_FILE: /run/secrets/content_migrator_url
    secrets: [content_migrator_url]

  # First deployment only: mockup content.
  content-seed:
    <<: *job
    image: ${REGISTRY:?REGISTRY is not set (.env)}/portfolio-content-service:${TAG:?TAG is not set (.env, scripts/deploy.sh)}
    command: ['node', 'cli.js', 'seed']
    environment:
      <<: *auth
      CONTENT_DATABASE_URL_FILE: /run/secrets/content_migrator_url
    secrets: [content_migrator_url]

  # The CLI loads the whole service configuration: placeholders for what migrations do not use.
  contact-migrate:
    <<: *job
    image: ${REGISTRY:?REGISTRY is not set (.env)}/portfolio-contact-service:${TAG:?TAG is not set (.env, scripts/deploy.sh)}
    command: ['node', 'cli.js', 'migrate']
    environment:
      <<: [*auth, *contact]
      CONTACT_DATABASE_URL_FILE: /run/secrets/contact_migrator_url
      CONTACT_SMTP_URL: 'json:'
      CONTACT_CLIENT_KEY_SECRET: migration-only-not-used-for-requests
    secrets: [contact_migrator_url]

  identity-migrate:
    <<: *job
    image: ${REGISTRY:?REGISTRY is not set (.env)}/portfolio-identity-service:${TAG:?TAG is not set (.env, scripts/deploy.sh)}
    command: ['node', 'cli.js', 'migrate']
    environment:
      <<: *identity
      IDENTITY_DATABASE_URL_FILE: /run/secrets/identity_migrator_url
    secrets: [identity_migrator_url]

  # Admin account creation (password read without echo, never in the shell history):
  #   read -rs IDENTITY_BOOTSTRAP_PASSWORD && export IDENTITY_BOOTSTRAP_PASSWORD
  #   docker compose -f compose.prod.yml --profile ops run --rm -e IDENTITY_BOOTSTRAP_PASSWORD identity-bootstrap <email>
  identity-bootstrap:
    <<: *job
    image: ${REGISTRY:?REGISTRY is not set (.env)}/portfolio-identity-service:${TAG:?TAG is not set (.env, scripts/deploy.sh)}
    entrypoint: ['node', 'cli.js', 'bootstrap-admin']
    environment:
      <<: *identity
      IDENTITY_DATABASE_URL_FILE: /run/secrets/identity_database_url
    secrets: [identity_database_url]

networks:
  traefik_proxy:
    external: true
    name: traefik_proxy
  proxy: {}
  database:
    internal: true

volumes:
  pgdata: {}

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  content_migrator_password: { file: ./secrets/content_migrator_password }
  content_app_password: { file: ./secrets/content_app_password }
  contact_migrator_password: { file: ./secrets/contact_migrator_password }
  contact_app_password: { file: ./secrets/contact_app_password }
  identity_migrator_password: { file: ./secrets/identity_migrator_password }
  identity_app_password: { file: ./secrets/identity_app_password }
  content_database_url: { file: ./secrets/content_database_url }
  contact_database_url: { file: ./secrets/contact_database_url }
  identity_database_url: { file: ./secrets/identity_database_url }
  content_migrator_url: { file: ./secrets/content_migrator_url }
  contact_migrator_url: { file: ./secrets/contact_migrator_url }
  identity_migrator_url: { file: ./secrets/identity_migrator_url }
  site_build_token: { file: ./secrets/site_build_token }
  seo_google_credentials: { file: ./secrets/seo_google_credentials }
  seo_pagespeed_api_key: { file: ./secrets/seo_pagespeed_api_key }
  contact_smtp_url: { file: ./secrets/contact_smtp_url }
  contact_client_key_secret: { file: ./secrets/contact_client_key_secret }

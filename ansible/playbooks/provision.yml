# Prepare application files, secrets and timers on an already provisioned shared VPS:
#   ansible-playbook playbooks/provision.yml
# SSH access, the deployment account, Docker and shared Traefik are managed separately.
- name: Prepare the portfolio on the shared VPS
  hosts: vps
  become: true
  roles:
    - role: portfolio
      vars:
        portfolio_deploy_services: false

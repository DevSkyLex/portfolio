# Publishes the static site: copies the built release, then atomically switches the `current` link
# (scripts/publish-site.sh: pre-compression, `previous` link, old releases removed).
- name: Valid release name
  ansible.builtin.assert:
    that: release is defined and release is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
    fail_msg: 'release required (-e release=…): letters, digits, dot, hyphen, underscore'
    quiet: true

- name: Built site present
  ansible.builtin.stat:
    path: '{{ site_dist }}/browser/index.html'
  delegate_to: localhost
  register: site_built

- name: Site built before publishing
  ansible.builtin.assert:
    that: site_built.stat.exists
    fail_msg: '{{ site_dist }}/browser/index.html missing (npx nx build web)'
    quiet: true

- name: Current release
  ansible.builtin.stat:
    path: '{{ site_root }}/current'
  register: site_current

# A live release is never rewritten in place: a new build gets a new name.
- name: Release not already live
  ansible.builtin.assert:
    that: not site_current.stat.exists or site_current.stat.lnk_target != 'releases/' + release
    fail_msg: 'release {{ release }} is the live one: publish under a new name'
    quiet: true

- name: Copy the release
  ansible.posix.synchronize:
    src: '{{ site_dist }}/'
    dest: '{{ site_root }}/releases/{{ release }}/'
    delete: true
    rsync_opts: ['--chmod=D755,F644']

- name: Switch to the new release
  ansible.builtin.command: bash {{ app_root }}/scripts/publish-site.sh {{ release }}
  changed_when: true

# Secrets template. Copy to vault.yml, fill in, then encrypt:
#   ansible-vault encrypt group_vars/all/vault.yml
# Passwords: hexadecimal (openssl rand -hex 24), so no character needs escaping in a Postgres URL.
vault_postgres_password: CHANGE_ME
vault_db:
  content: { migrator: CHANGE_ME, app: CHANGE_ME }
  contact: { migrator: CHANGE_ME, app: CHANGE_ME }
  identity: { migrator: CHANGE_ME, app: CHANGE_ME }
# OVH SMTP: smtps://user%40domain:password@ssl0.ovh.net:465
vault_contact_smtp_url: CHANGE_ME
# At least 32 characters (openssl rand -hex 32).
vault_contact_client_key_secret: CHANGE_ME
# Fine-grained GitHub token with Actions: write on the site repository only.
vault_site_build_token: CHANGE_ME
# Ed25519 token signing keys (openssl genpkey -algorithm ed25519); all are published in the JWKS,
# `identity_signing_kid` selects the one that signs.
vault_identity_signing_keys:
  k1: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME
    -----END PRIVATE KEY-----
# GitHub token (classic or fine-grained) with read:packages, to pull the private images from GHCR.
vault_ghcr_user: CHANGE_ME
vault_ghcr_token: CHANGE_ME

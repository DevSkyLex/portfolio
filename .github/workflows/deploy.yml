# Services: images built and published to GHCR, then deployed to the VPS (backup → migrations → restart).
# A published GitHub release deploys the commit referenced by its tag.
name: Deploy services

on:
  release:
    types: [published]

concurrency:
  group: deploy-services
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  prepare:
    timeout-minutes: 30
    needs: resolve
    runs-on: ubuntu-24.04
    env:
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: ./.github/actions/prepare-node-workspace
        with:
          cache-dependencies: 'false'
      - name: Prepare service build contexts
        run: npx nx run-many -t prune -p identity-service content-service contact-service --parallel=2
      - name: Build request-time SSR application
        run: npx nx build web
      # The shared root is dist/apps, so each image keeps its own directory in the artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: service-contexts-${{ needs.resolve.outputs.sha }}
          path: |
            dist/apps/*-service/package.json
            dist/apps/*-service/package-lock.json
            dist/apps/*-service/main.js
            dist/apps/*-service/cli.js
            dist/apps/*-service/migrations/
            dist/apps/web/browser/
            dist/apps/web/server/
            dist/apps/web/3rdpartylicenses.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  images:
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    needs: [resolve, prepare]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [identity-service, content-service, contact-service, web]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: service-contexts-${{ needs.resolve.outputs.sha }}
          path: dist/apps
      - name: Registry (GHCR requires a lowercase owner)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: dist/apps/${{ matrix.service }}
          file: ${{ matrix.service == 'web' && 'docker/web.Dockerfile' || 'docker/service.Dockerfile' }}
          build-args: SERVICE=${{ matrix.service }}
          cache-from: type=gha,version=2,scope=portfolio-${{ matrix.service }}
          cache-to: type=gha,version=2,scope=portfolio-${{ matrix.service }},mode=max,ignore-error=true
          push: true
          tags: |
            ${{ env.REGISTRY }}/portfolio-${{ matrix.service }}:${{ needs.resolve.outputs.sha }}
            ${{ env.REGISTRY }}/portfolio-${{ matrix.service }}:latest

  deploy:
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    needs: [resolve, images]
    runs-on: ubuntu-24.04
    environment: production
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      APP_HOST: ${{ vars.APP_HOST }}
      VPS_APP_PORT: ${{ vars.VPS_APP_PORT }}
      DOCKER_PROJECT_NAME: ${{ vars.DOCKER_PROJECT_NAME }}
      DOCKER_CONTAINER_NAME: ${{ vars.DOCKER_CONTAINER_NAME }}
      TRAEFIK_ROUTER_NAME: ${{ vars.TRAEFIK_ROUTER_NAME }}
      TRAEFIK_SECURE_MIDDLEWARES: ${{ vars.TRAEFIK_SECURE_MIDDLEWARES }}
      TRUSTED_PROXIES: ${{ vars.TRUSTED_PROXIES }}
      WEB_MEMORY_LIMIT: ${{ vars.WEB_MEMORY_LIMIT }}
      WEB_CPU_LIMIT: ${{ vars.WEB_CPU_LIMIT }}
      SSR_MEMORY_LIMIT: ${{ vars.SSR_MEMORY_LIMIT }}
      SSR_CPU_LIMIT: ${{ vars.SSR_CPU_LIMIT }}
      LOG_MAX_SIZE: ${{ vars.LOG_MAX_SIZE }}
      LOG_MAX_FILES: ${{ vars.LOG_MAX_FILES }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      CONTACT_MAIL_FROM: ${{ vars.CONTACT_MAIL_FROM }}
      CONTACT_NOTIFY_TO: ${{ vars.CONTACT_NOTIFY_TO }}
      SEO_SEARCH_CONSOLE_PROPERTY: ${{ vars.SEO_SEARCH_CONSOLE_PROPERTY }}
      SEO_GA4_PROPERTY_ID: ${{ vars.SEO_GA4_PROPERTY_ID }}
      SEO_WEB_VITALS_URLS: ${{ vars.SEO_WEB_VITALS_URLS }}
      IDENTITY_SIGNING_KID: ${{ vars.IDENTITY_SIGNING_KID || 'k1' }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Ansible
        working-directory: ansible
        run: |
          pipx install ansible-core==2.21.5
          ansible-galaxy collection install -r requirements.yml -p .collections
      - name: VPS access (SSH key and verified server key)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy (backup, migrations, restart, health)
        working-directory: ansible
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CONTENT_MIGRATOR_PASSWORD: ${{ secrets.CONTENT_MIGRATOR_PASSWORD }}
          CONTENT_APP_PASSWORD: ${{ secrets.CONTENT_APP_PASSWORD }}
          CONTACT_MIGRATOR_PASSWORD: ${{ secrets.CONTACT_MIGRATOR_PASSWORD }}
          CONTACT_APP_PASSWORD: ${{ secrets.CONTACT_APP_PASSWORD }}
          IDENTITY_MIGRATOR_PASSWORD: ${{ secrets.IDENTITY_MIGRATOR_PASSWORD }}
          IDENTITY_APP_PASSWORD: ${{ secrets.IDENTITY_APP_PASSWORD }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          CONTACT_CLIENT_KEY_SECRET: ${{ secrets.CONTACT_CLIENT_KEY_SECRET }}
          IDENTITY_SIGNING_KEY_K1: ${{ secrets.IDENTITY_SIGNING_KEY_K1 }}
          IDENTITY_SIGNING_KEY_K2: ${{ secrets.IDENTITY_SIGNING_KEY_K2 }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          SEO_GOOGLE_CREDENTIALS: ${{ secrets.SEO_GOOGLE_CREDENTIALS }}
          SEO_PAGESPEED_API_KEY: ${{ secrets.SEO_PAGESPEED_API_KEY }}
        run: |
          set -euo pipefail
          node ../.github/scripts/validate-production-secrets.mjs
          ansible-playbook playbooks/deploy.yml \
            -e ansible_host="$VPS_HOST" \
            -e "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" \
            -e tag=${{ needs.resolve.outputs.sha }}

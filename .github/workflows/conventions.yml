name: Conventions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  naming:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Branch convention
        env:
          BRANCH: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$AUTHOR" = 'dependabot[bot]' ] && [[ "$BRANCH" = dependabot/* ]]; then
            exit 0
          fi
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*$'
          if ! [[ "$BRANCH" =~ $pattern ]]; then
            echo '::error::Use a branch named <type>/<kebab-description>.'
            exit 1
          fi
      - uses: ./.github/actions/prepare-node-workspace
        with:
          ignore-scripts: 'true'
      - name: Pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint
      - name: Commit conventions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the pull request cancels its previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: true
  NX_DAEMON: 'false'
  NX_TUI: 'false'
  NX_BASE: ${{ github.event.pull_request.base.sha }}
  NX_HEAD: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-node-workspace
      - run: node --test .github/scripts/validate-production-secrets.test.mjs
      - run: npx nx format:check
      - run: npx nx run-many -t test typecheck lint -p architecture
      - run: npx nx run web-e2e:test-tooling
      - run: npx nx affected -t lint typecheck build --parallel=3

  # Docker, Nginx, shell scripts and Ansible checks (docs/operations/deployment.md).
  ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/scripts/check-ops.sh

  # Tests and validators of the AI tooling (.claude/README.md, .codex/maintenance.md).
  ai-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-node-workspace
        with:
          ignore-scripts: 'true'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: node --test .claude/hooks/*.test.mjs .codex/hooks/*.test.mjs .codex/scripts/*.test.mjs
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -B -m unittest discover -s .codex/scripts -p "test_*.py"
      - run: python -B .codex/scripts/validate.py

  # Unit, component and integration tests with coverage thresholds (docs/workspace/testing.md).
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Collect every partition's failures and coverage even if another one fails.
      fail-fast: false
      matrix:
        platform: [web, server, neutral]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-node-workspace
      - name: Tests with coverage (affected projects)
        # Partitions run on separate runners. Keep nested Vitest workers within each runner's budget.
        run: npx nx affected -t test --coverage --parallel=1 --exclude='*,!tag:platform:${{ matrix.platform }},web-e2e,architecture'
      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.platform }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Keep a single required check for branch protection while the partitions run independently.
  tests:
    if: always()
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all coverage partitions
        env:
          RESULT: ${{ needs.coverage.result }}
        run: test "$RESULT" = success

  # Built SSR application with a disposable content fixture API for browser acceptance.
  e2e:
    # Keep the browser dependencies on a stable runner while ubuntu-latest migrates to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-node-workspace
      - name: Detect affected browser suite
        id: affected
        run: |
          npx nx show projects --affected --withTarget=e2e --json > "$RUNNER_TEMP/e2e-projects.json"
          node -e "const fs = require('node:fs'); const projects = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log('run=' + projects.includes('web-e2e'));" "$RUNNER_TEMP/e2e-projects.json" >> "$GITHUB_OUTPUT"
      # The hosted Azure mirror can be too slow for Playwright's browser dependencies.
      - run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
        if: steps.affected.outputs.run == 'true'
      - uses: ./.github/actions/prepare-playwright
        if: steps.affected.outputs.run == 'true'
        with:
          browsers: chromium firefox webkit
        timeout-minutes: 30
      # web-e2e:e2e depends on web:build and runs when the site is affected.
      - run: npx nx affected -t e2e
        if: steps.affected.outputs.run == 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: dist/.playwright/apps/web-e2e/
          retention-days: 7

  # Full stack (Compose: Postgres, services, Nginx, Mailpit) for the admin and contact journeys.
  # The runner owns a disposable Compose project and tears it down even after failure.
  e2e-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-node-workspace
      - uses: ./.github/actions/prepare-playwright
      - name: Isolated authenticated acceptance
        run: npx nx run web-e2e:e2e-stack
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-stack-report
          path: dist/.playwright/apps/web-e2e/
          retention-days: 7

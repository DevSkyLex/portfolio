name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

# One run per branch or pull request; a new push cancels the previous run (never on main).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_NO_CLOUD: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test .github/scripts/validate-production-secrets.test.mjs
      # NX_BASE/NX_HEAD: last successful CI run on main, or the pull request base.
      - uses: nrwl/nx-set-shas@v4
      - run: npx nx format:check
      - run: npx nx run-many -t test typecheck lint -p architecture
      - run: npx nx run-many -t test-tooling test-snapshot -p web-e2e web
      - run: npx nx affected -t lint typecheck build --parallel=3

  # Docker, Nginx, shell scripts and Ansible checks (docs/operations/deployment.md).
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash docker/scripts/check-ops.sh

  # Tests and validators of the AI tooling (.claude/README.md, .codex/maintenance.md).
  ai-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: node --test .claude/hooks/*.test.mjs .codex/hooks/*.test.mjs .codex/scripts/*.test.mjs
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -B -m unittest discover -s .codex/scripts -p "test_*.py"
      - run: python -B .codex/scripts/validate.py

  # Unit, component and integration tests with coverage thresholds (docs/workspace/testing.md).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@v4
      - name: Tests with coverage (affected on pull requests, everything on main)
        # Each test target starts its own workers; serial targets avoid exhausting the hosted runner.
        run: npx nx ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }} -t test --coverage --parallel=1 --exclude=web-e2e,architecture
      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Built, prerendered site served with the Nginx routing (apps/web-e2e/support/preview/serve-site.mjs), no services.
  e2e:
    needs: quality
    # Keep the browser dependencies on a stable runner while ubuntu-latest migrates to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@v4
      - run: npx playwright install --with-deps chromium firefox webkit
        timeout-minutes: 10
      # web-e2e:e2e depends on web:build; on a pull request it only runs when the site is affected.
      - run: npx nx ${{ github.event_name == 'pull_request' && 'affected -t e2e' || 'run-many -t e2e -p web-e2e' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dist/.playwright/apps/web-e2e/
          retention-days: 7

  # Full stack (Compose: Postgres, services, Nginx, Mailpit) for the admin and contact journeys.
  # The runner owns a disposable Compose project and tears it down even after failure.
  e2e-stack:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Isolated authenticated acceptance
        run: npx nx run web-e2e:e2e-stack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-stack-report
          path: dist/.playwright/apps/web-e2e/
          retention-days: 7

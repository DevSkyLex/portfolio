name: Feature request
description: Propose a user-facing improvement.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who encounters this problem, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user journey and the outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing behavior or a simpler solution.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable results, including French/English and accessibility needs where relevant.
    validations:
      required: true

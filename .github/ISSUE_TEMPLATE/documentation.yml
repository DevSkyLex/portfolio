name: Documentation improvement
description: Report missing, incorrect or unclear documentation.
labels: ['documentation']
body:
  - type: input
    id: location
    attributes:
      label: Document or section
      description: Link the file, heading or command that needs clarification.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested correction
      description: Include the expected command, explanation or example if known.
    validations:
      required: true

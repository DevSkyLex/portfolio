name: Prepare Node workspace
description: Pin the declared npm version, prepare locked dependencies and optionally install Playwright.

inputs:
  node-version:
    description: Node.js version to install
    default: '24'
  cache-dependencies:
    description: Restore exact dependency caches; disable for release builds
    default: 'true'
  ignore-scripts:
    description: Disable dependency lifecycle scripts for tooling-only jobs
    default: 'false'
  install-playwright-browsers:
    description: Install Playwright browsers and their system dependencies
    default: 'false'
  playwright-browsers:
    description: Space-separated browser names
    default: chromium

runs:
  using: composite
  steps:
    - name: Identify the Ubuntu image
      id: runner
      shell: bash
      run: |
        . /etc/os-release
        echo "image=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
    - name: Set up Node.js
      id: node
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Pin the declared npm version
      id: npm
      shell: bash
      run: |
        npm_version="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
        [[ "$npm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'packageManager must declare an exact npm version'; exit 1; }
        npm install --global "npm@$npm_version" --ignore-scripts --no-audit --no-fund
        echo "version=$npm_version" >> "$GITHUB_OUTPUT"
        node --version
        npm --version
    - name: Restore locked dependencies
      id: modules
      if: inputs.cache-dependencies == 'true'
      uses: actions/cache@v4
      with:
        path: node_modules
        # No fallback key: native dependencies, lockfile and lifecycle policy must match exactly.
        key: modules-v1-${{ runner.os }}-${{ steps.runner.outputs.image }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-npm${{ steps.npm.outputs.version }}-scripts${{ inputs.ignore-scripts }}-${{ hashFiles('package-lock.json', '.npmrc', 'package.json') }}
    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [ "$IGNORE_SCRIPTS" = true ]; then
          npm ci --ignore-scripts --no-audit --no-fund
        else
          npm ci --no-audit --no-fund
        fi
    - name: Prepare Playwright
      if: inputs.install-playwright-browsers == 'true'
      uses: ./.github/actions/prepare-playwright
      with:
        browsers: ${{ inputs.playwright-browsers }}
